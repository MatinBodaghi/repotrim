[package]
name = "repotrim"
version = "0.1.0"
edition = "2021"
description = "Mathematically optimal codebase context trimmer for AI coding agents"

[lib]
name = "repotrim_cli"
path = "src/lib.rs"

[[bin]]
name = "repotrim"
path = "src/main.rs"

[dependencies]
repotrim-engine = { path = "../engine" }
repotrim-mcp = { path = "../mcp-server" }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
