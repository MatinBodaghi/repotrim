[package]
name = "repotrim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Mathematically optimal codebase context trimmer for AI coding agents"
exclude = ["tests/*"]

[lib]
name = "repotrim_cli"
path = "src/lib.rs"

[[bin]]
name = "repotrim"
path = "src/main.rs"

[dependencies]
repotrim-engine = { path = "../engine", version = "0.12.0" }
repotrim-mcp = { path = "../mcp-server", version = "0.12.0" }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

