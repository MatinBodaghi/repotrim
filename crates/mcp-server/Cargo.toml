[package]
name = "repotrim-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) server for RepoTrim"

[lib]
name = "repotrim_mcp"
path = "src/lib.rs"

[[bin]]
name = "repotrim-mcp"
path = "src/main.rs"

[dependencies]
repotrim-engine = { path = "../engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
