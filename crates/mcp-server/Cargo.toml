[package]
name = "repotrim-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords = ["mcp", "llm", "agent", "context", "tools"]
categories.workspace = true
description = "Model Context Protocol (MCP) server for RepoTrim"
exclude = ["tests/*"]

[lib]
name = "repotrim_mcp"
path = "src/lib.rs"

[[bin]]
name = "repotrim-mcp"
path = "src/main.rs"

[dependencies]
repotrim-engine = { path = "../engine", version = "0.13.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

