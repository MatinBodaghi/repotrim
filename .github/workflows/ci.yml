name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run default unit & integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Run tests without default features (heuristic tokenization)
        run: cargo test -p repotrim-engine --no-default-features --locked

      - name: Run tests with all features enabled
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --workspace --locked

  msrv:
    name: MSRV Check (1.90.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"

      - name: Verify MSRV check
        run: cargo check --workspace --all-targets --locked

      - name: Verify MSRV tests
        run: cargo test -p repotrim-engine --no-default-features --locked
