name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            bin_suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            bin_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            bin_suffix: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            bin_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            bin_suffix: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries (Native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Build release binaries (Cross)
        if: ${{ matrix.use_cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target ${{ matrix.target }} --workspace

      - name: Package release assets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          STAGING="repotrim-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/repotrim${{ matrix.bin_suffix }}" "$STAGING/"
          cp "target/${{ matrix.target }}/release/repotrim-mcp${{ matrix.bin_suffix }}" "$STAGING/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGING/"
          tar -czf "$STAGING.tar.gz" "$STAGING"
          sha256sum "$STAGING.tar.gz" > "$STAGING.tar.gz.sha256"
          echo "ASSET_PATH=$STAGING.tar.gz" >> $GITHUB_ENV

      - name: Package release assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "repotrim-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/repotrim.exe" -Destination $staging
          Copy-Item "target/${{ matrix.target }}/release/repotrim-mcp.exe" -Destination $staging
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"
          $hash = (Get-FileHash -Path "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $staging.zip" | Out-File -Encoding ascii -FilePath "$staging.zip.sha256"
          echo "ASSET_PATH=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_PATH }}.sha256
          generate_release_notes: true

  publish-crates:
    name: Publish Crates to crates.io
    needs: [build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not configured; skipping crates.io publishing."
            exit 0
          fi

          echo "Publishing repotrim-engine..."
          cargo publish -p repotrim-engine --token "$CARGO_REGISTRY_TOKEN"

          echo "Waiting 30 seconds for crates.io index propagation..."
          sleep 30

          echo "Publishing repotrim-mcp..."
          cargo publish -p repotrim-mcp --token "$CARGO_REGISTRY_TOKEN"

          echo "Waiting 30 seconds for crates.io index propagation..."
          sleep 30

          echo "Publishing repotrim CLI..."
          cargo publish -p repotrim --token "$CARGO_REGISTRY_TOKEN"

